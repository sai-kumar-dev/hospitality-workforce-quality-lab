name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_BASE_URL: http://localhost:4173
      API_BASE_URL: http://localhost:8000
      TEST_ENV: ci
      TEST_USER_PASSWORD: ShiftBridge-Demo-2026!
      ARTIFACTS_DIR: artifacts
      HEADLESS: "true"
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Validate Compose
        run: docker compose config
      - name: Build stack
        run: docker compose build
      - name: Start healthy stack
        run: |
          docker compose up -d
          uv run python scripts/wait_for_stack.py
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: API suite
        run: >-
          uv run pytest qa/tests/api -m api -n auto
          --junitxml=artifacts/junit/api.xml
          --html=artifacts/pytest/api.html --self-contained-html
      - name: Bounded contract suite
        env:
          SCHEMATHESIS_PROFILE: ci
        run: >-
          uv run pytest qa/tests/contract -m contract
          --junitxml=artifacts/junit/contract.xml
      - name: Chromium UI smoke suite
        run: >-
          uv run pytest qa/tests/ui -m smoke --browser chromium
          --tracing retain-on-failure
          --video retain-on-failure
          --screenshot only-on-failure
          --junitxml=artifacts/junit/ui-smoke.xml
          --html=artifacts/pytest/ui-smoke.html --self-contained-html
      - name: Collect Compose diagnostics
        if: failure()
        run: docker compose logs --no-color > artifacts/compose.log
      - name: Triage failures
        if: failure()
        run: >-
          uv run shiftbridge-triage
          --junit artifacts/junit
          --console artifacts/browser
          --http artifacts/http
          --output artifacts/triage
      - name: Publish job summary
        if: always()
        run: |
          echo "## ShiftBridge integration results" >> "$GITHUB_STEP_SUMMARY"
          echo "- API, bounded contract, and Chromium smoke suites were executed." >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/triage/triage-report.md ]; then
            cat artifacts/triage/triage-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans

