name: Performance smoke

on:
  workflow_dispatch:
    inputs:
      users:
        description: "Concurrent users"
        required: false
        default: "5"
      duration:
        description: "Run duration"
        required: false
        default: "30s"
  schedule:
    - cron: "41 4 * * 6"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked
      - run: docker compose up -d --build
      - run: uv run python scripts/wait_for_stack.py
      - name: Run regression smoke load
        run: >-
          uv run locust -f qa/performance/locustfile.py
          --headless --host http://localhost:8000
          --users ${{ inputs.users || '5' }}
          --spawn-rate 2
          --run-time ${{ inputs.duration || '30s' }}
          --csv artifacts/performance/locust
          --html artifacts/performance/report.html
      - name: Enforce thresholds
        run: >-
          uv run shiftbridge-performance-thresholds
          --stats artifacts/performance/locust_stats.csv
      - if: failure()
        run: docker compose logs --no-color > artifacts/compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: artifacts
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: docker compose down --volumes --remove-orphans

