name: Cross-browser

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2,5"

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      APP_BASE_URL: http://localhost:4173
      API_BASE_URL: http://localhost:8000
      TEST_ENV: ci
      TEST_USER_PASSWORD: ShiftBridge-Demo-2026!
      SESSION_SECRET: ci-only-session-secret-with-more-than-32-characters
      ARTIFACTS_DIR: artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked
      - run: docker compose up -d --build
      - run: uv run python scripts/wait_for_stack.py
      - run: uv run playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke
        run: >-
          uv run pytest qa/tests/ui -m smoke
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --screenshot only-on-failure
          --junitxml=artifacts/junit/${{ matrix.browser }}.xml
      - if: failure()
        run: docker compose logs --no-color > artifacts/compose-${{ matrix.browser }}.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.browser }}-artifacts
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose down --volumes --remove-orphans

