name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.0
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict type checking
        run: uv run mypy --strict apps/api/src qa/src
      - name: Backend unit coverage
        run: >-
          uv run pytest apps/api/tests -m unit
          --cov=shiftbridge_api --cov-branch
          --cov-report=term-missing
          --cov-report=json:artifacts/coverage/backend.json
          --cov-report=xml:artifacts/coverage/backend.xml
          --cov-report=html:artifacts/coverage/backend
      - name: Enforce backend coverage
        run: >-
          uv run python scripts/check_coverage.py
          artifacts/coverage/backend.json
          --line 85 --branch 80
      - name: QA framework unit coverage
        run: >-
          uv run pytest qa/tests/unit -m unit
          --cov=shiftbridge_qa --cov-branch
          --cov-report=term-missing
          --cov-report=json:artifacts/coverage/qa.json
          --cov-report=xml:artifacts/coverage/qa.xml
          --cov-report=html:artifacts/coverage/qa
      - name: Enforce QA framework coverage
        run: >-
          uv run python scripts/check_coverage.py
          artifacts/coverage/qa.json
          --line 90 --branch 85
      - name: Upload Python reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-quality-reports
          path: artifacts/coverage
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run format:check
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run test
      - run: npm --prefix apps/web run build

